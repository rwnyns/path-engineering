<script>
        // الربط المباشر مع مشروعك في Supabase
        const SUPABASE_URL = 'https://ogesvdbsgptfifllduyv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8SQ-JfcbI2uGBstuTps0ow_hNbaNym8';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // إرسال البيانات للجدول
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const responseMsg = document.getElementById('responseMessage');
            
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const role = document.getElementById('role').value;

            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري الحفظ...';
            responseMsg.style.color = '#333';
            responseMsg.innerText = 'جاري الإرسال...';

            try {
                const { data, error } = await supabase
                    .from('registrations')
                    .insert([{ full_name: fullName, email: email, role: role }]);

                if (error) {
                    console.error('Supabase Error:', error);
                    throw error;
                }

                responseMsg.style.color = 'green';
                responseMsg.innerText = '✅ تم تسجيل بياناتك بنجاح!';
                alert('تم التسجيل بنجاح!');
                document.getElementById('registrationForm').reset();
            } catch (err) {
                console.error('Catch Error:', err);
                responseMsg.style.color = 'red';
                if(err.code === '23505' || (err.message && err.message.includes('duplicate'))) {
                    responseMsg.innerText = '⚠️ هذا البريد الإلكتروني مسجل مسبقاً.';
                } else {
                    responseMsg.innerText = '❌ خطأ: ' + (err.message || 'تعذر الاتصال بقاعدة البيانات');
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'إرسال البيانات';
            }
        });
    </script>
