<script>
        //---------------- SUPABASE INTEGRATION ----------------
        const SUPABASE_URL = 'https://ogesvdbsgptfifllduyv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_8SQ-JfcbI2uGBstuTps0ow_hNbaNym8';

        let _supabase = null;
        if (typeof supabase !== 'undefined') {
            _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // ---------------- نماذج مرشدين مقترحة حسب جميع التخصصات الهندسيّة ----------------
        const suggestedMentors = [
            { major: "communication", name: "م. مقترح - اتصالات وشبكات", exp: "خبير شبكات Cisco & 5G", company: "قطاع الاتصالات", bio: "إرشاد في بروتوكولات الشبكات، الأمن السيبراني للشبكات، ومشاريع الأنظمة اللاسلكية." },
            { major: "software", name: "م. مقترح - برمجيات وحاسوب", exp: "خبير Full-Stack & Cloud", company: "شركات التطوير البرمجي", bio: "توجيه في قواعد البيانات، تطوير الويب والأنظمة الموزعة، وربط الخدمات مثل Supabase." },
            { major: "civil", name: "م. مقترح - هندسة مدنية", exp: "استشاري إدارة مشاريع إنشائية", company: "المكاتب الهندسية الاستشارية", bio: "إرشاد في التصميم الإنشائي، حساب الكميات، وبرامج التحليل الهيكلي." },
            { major: "electrical", name: "م. مقترح - هندسة كهربائية", exp: "مهندس أنظمة طاقة وقوى", company: "قطاع الطاقة والتوزيع", bio: "مساعدة في مشاريع الطاقة المتجددة، أنظمة التحكم الكهربائي، وحماية الشبكات." },
            { major: "mechanical", name: "م. مقترح - هندسة ميكانيكية", exp: "مهندس تصميم وتصنيع", company: "القطاع الصناعي والتكييف", bio: "إرشاد في أنظمة HVAC، النمذجة الميكانيكية، وتحليل الإجهادات." },
            { major: "mechatronics", name: "م. مقترح - ميكاترونكس", exp: "مهندس أتمتة وروبوتات", company: "أنظمة التحكم والأتمتة", bio: "توجيه في البرمجة المدمجة Embedded Systems، الميكروكنترولر، والحساسات." },
            { major: "chemical", name: "م. مقترح - هندسة كيميائية", exp: "مهندس عمليات وتشغيل", company: "الصناعات الكيميائية والنفطية", bio: "إرشاد في تصميم العمليات الصناعية، الموازنة الكتلية، وأنظمة السلامة." },
            { major: "architectural", name: "م. مقترح - هندسة معمارية", exp: "مصمم معماري وحضري", company: "مكاتب التصميم والتخطيط", bio: "توجيه في إخراج مشاريع التخرج المعمارية، إعداد الفكرة، واستخدام برامج الرندر." },
            { major: "industrial", name: "م. مقترح - هندسة صناعية", exp: "أخصائي سلاسل إمداد وجودة", company: "إدارة العمليات والجودة", bio: "توجيه في تحسين العمليات، الهندسة المالية، وضبط الجودة الشاملة." },
            { major: "biomedical", name: "م. مقترح - هندسة طبية حيوية", exp: "مهندس صيانة ومعايرة أجهزة", company: "المستشفيات والشركات الطبية", bio: "إرشاد في تصميم الأجهزة الطبية، الحساسات البيولوجية، ومعالجة الإشارات الحيوية." }
        ];

        // ---------------- إدارة اختيار الفئة (Role Selector) ----------------
        const roleOptions = document.querySelectorAll('.role-opt');
        const roleInput = document.getElementById('role');
        const submitBtn = document.getElementById('submitBtn');
        const studentFields = document.getElementById('studentFields');
        const mentorFields = document.getElementById('mentorFields');
        const companyFields = document.getElementById('companyFields');

        roleOptions.forEach(option => {
            option.addEventListener('click', () => {
                roleOptions.forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                const val = option.getAttribute('data-value');
                roleInput.value = val;

                if (val === 'student') {
                    submitBtn.textContent = 'المتابعة لاختيار المرشد';
                    studentFields.style.display = 'block';
                    mentorFields.style.display = 'none';
                    companyFields.style.display = 'none';
                    document.getElementById('studentMajor').required = true;
                    document.getElementById('mentorMajor').required = false;
                    document.getElementById('companyName').required = false;
                } else if (val === 'mentor') {
                    submitBtn.textContent = 'تسجيل بيانات المرشد الرسمية';
                    studentFields.style.display = 'none';
                    mentorFields.style.display = 'block';
                    companyFields.style.display = 'none';
                    document.getElementById('studentMajor').required = false;
                    document.getElementById('mentorMajor').required = true;
                    document.getElementById('companyName').required = false;
                } else {
                    submitBtn.textContent = 'تسجيل بيانات الشركة وتفعيل المتابعة';
                    studentFields.style.display = 'none';
                    mentorFields.style.display = 'none';
                    companyFields.style.display = 'block';
                    document.getElementById('studentMajor').required = false;
                    document.getElementById('mentorMajor').required = false;
                    document.getElementById('companyName').required = true;
                }
            });
        });

        // ---------------- إرسال النموذج + حفظ البيانات في Supabase ----------------
        const regForm = document.getElementById('registrationForm');
        const responseMsg = document.getElementById('responseMessage');

        regForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const val = id => document.getElementById(id).value.trim();
            const fullName = val('fullName');
            const email = val('email');
            const role = roleInput.value;

            // الحقول الإضافية حسب الفئة تُحفظ في عمود details
            let details = {};
            if (role === 'student') {
                details = { major: val('studentMajor') };
            } else if (role === 'mentor') {
                details = { major: val('mentorMajor'), experience: val('mentorExperience'), company: val('mentorCompany'), bio: val('mentorBio') };
            } else {
                details = { company_name: val('companyName'), sector: val('companySector'), goal: val('companyGoal') };
            }

            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري إرسال البيانات...';
            responseMsg.textContent = '';

            try {
                if (!_supabase) throw new Error('Supabase client is not initialized');
                const { error } = await _supabase
                    .from('registrations')
                    .insert([{ full_name: fullName, email: email, role: role, details: details }]);
                if (error) throw error;
            } catch (err) {
                console.error(err);
                responseMsg.style.color = '#d93838';
                responseMsg.textContent = 'حدث خطأ أثناء الإرسال. يرجى المحاولة لاحقاً.';
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
                return;
            }
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;

            if (role === 'student') {
                const majorSelect = document.getElementById('studentMajor');
                const majorText = majorSelect.options[majorSelect.selectedIndex].text;
                document.getElementById('studentSummary').textContent = `أهلاً بك ${fullName} — مقترحات المرشدين المتاحة لتخصص (${majorText}):`;
                renderMentors(majorSelect.value);
                goToStep(2);
            } else if (role === 'mentor') {
                responseMsg.style.color = 'var(--mint)';
                responseMsg.textContent = `شكراً مهندس/ة ${fullName}، تم استقبال بياناتك الرسمية بنجاح! سيقوم فريق المنصة بمراجعتها والتواصل معك لتفعيل حساب المرشد.`;
                regForm.reset();
                roleOptions[0].click();
            } else {
                responseMsg.style.color = 'var(--mint)';
                responseMsg.textContent = `شكراً لك ${fullName} (ممثل شركة ${details.company_name})، تم إرسال الطلب بنجاح! سيتواصل معكم فريق المنصة لتزويدكم بلوحة التحكم وتفعيل نظام متابعة المتدربين.`;
                regForm.reset();
                roleOptions[0].click();
            }
        });

        function goToStep(stepNumber) {
            document.querySelectorAll('.form-step').forEach(step => step.classList.remove('active'));
            document.getElementById(`step-${stepNumber}`).classList.add('active');
            responseMsg.textContent = '';
        }

        function renderMentors(majorKey) {
            const listContainer = document.getElementById('mentorsList');
            listContainer.innerHTML = '';
            const filtered = suggestedMentors.filter(m => m.major === majorKey);

            if (filtered.length === 0) {
                listContainer.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--muted);">سيتم اختيار ومطابقة مرشد متخصص معك فور تثبيت الطلب.</p>`;
                return;
            }

            filtered.forEach(m => {
                const card = document.createElement('div');
                card.className = 'mentor-card';
                card.innerHTML = `
                    <h3>${m.name}</h3>
                    <span class="mentor-badge">${m.exp}</span>
                    <p><strong>المجال/القطاع:</strong> ${m.company}</p>
                    <p style="margin-top:6px;">${m.bio}</p>
                    <button class="btn btn-primary" style="margin-top:12px; width:100%; padding:8px 12px; font-size:13.5px;" onclick="bookMentor('${m.name}')">طلب مطابقة وحجز جلسة</button>
                `;
                listContainer.appendChild(card);
            });
        }

        function bookMentor(mentorTitle) {
            responseMsg.style.color = 'var(--mint)';
            responseMsg.textContent = `تم تسجيل طلبك المبدئي لمطابقة (${mentorTitle}) بنجاح! سيتواصل معك فريق المنصة لتأكيد المرشد النهائي والموعد.`;
        }

        // ---------------- SCROLL + CHATBOT ----------------
        const header = document.getElementById('siteHeader');
        window.addEventListener('scroll', () => {
            header.classList.toggle('scrolled', window.scrollY > 20);
        });

        const chatToggleBtn = document.getElementById('chatToggleBtn');
        const chatWidget = document.getElementById('chatWidget');
        const chatCloseBtn = document.getElementById('chatCloseBtn');

        chatToggleBtn.addEventListener('click', () => {
            chatWidget.style.display = (chatWidget.style.display === 'flex') ? 'none' : 'flex';
        });
        chatCloseBtn.addEventListener('click', () => {
            chatWidget.style.display = 'none';
        });

        // معرّف جلسة ثابت لكل متصفح (لحفظ المحادثة وربطها)
        function getSessionId() {
            let id = null;
            try { id = localStorage.getItem('chat_session_id'); } catch (e) {}
            if (!id) {
                id = crypto.randomUUID();
                try { localStorage.setItem('chat_session_id', id); } catch (e) {}
            }
            return id;
        }

        let chatBusy = false;

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || chatBusy) return;

            appendMessage(text, 'user');
            input.value = '';
            chatBusy = true;
            const bubble = appendMessage('...', 'bot');

            try {
                if (!_supabase) throw new Error('Supabase not initialized');
                const { data, error } = await _supabase.functions.invoke('chat', {
                    body: { message: text, session_id: getSessionId() }
                });
                if (error) throw error;
                setMessage(bubble, data.reply);
            } catch (err) {
                console.error(err);
                setMessage(bubble, 'عذراً، تعذّر الاتصال بالمساعد الآن. جرّب مرة ثانية بعد لحظات.');
            } finally {
                chatBusy = false;
                document.getElementById('chatMessages').scrollTop = 1e9;
            }
        }

        function appendMessage(text, side) {
            const container = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = `chat-msg ${side}`;
            msg.textContent = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
            return msg;
        }

        // يعرض رد البوت مع تحويل الروابط إلى روابط قابلة للضغط
        function setMessage(el, text) {
            el.textContent = '';
            text.split(/(https?:\/\/[^\s)]+)/g).forEach(part => {
                if (/^https?:\/\//.test(part)) {
                    const a = document.createElement('a');
                    a.href = part; a.target = '_blank'; a.rel = 'noopener noreferrer';
                    a.textContent = part;
                    el.appendChild(a);
                } else {
                    el.appendChild(document.createTextNode(part));
                }
            });
        }
    </script>
