<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الطلاب - Path Engineering</title>

  <!-- مكتبة Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <h2>نموذج التسجيل</h2>

  <form id="registrationForm">
    <div>
      <label for="fullName">الاسم الكامل:</label><br>
      <input type="text" id="fullName" placeholder="أدخل اسمك الكامل" required>
    </div>
    <br>
    <div>
      <label for="email">البريد الإلكتروني:</label><br>
      <input type="email" id="email" placeholder="example@domain.com" required>
    </div>
    <br>
    <button type="submit" id="submitBtn">إرسال التسجيل</button>
  </form>

  <p id="statusMessage"></p>

  <script>
    // 1. قيم الاتصال بقاعدة البيانات الخاصة بمشروعك في Supabase
    const SUPABASE_URL = 'https://ogesvdbsgptfifllduyv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nZXN2ZGJzZ3B0ZmlmbGxkdXl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDM1MjgsImV4cCI6MjEwMzcxOTUyOH0.iawdyfh61v4mW1ZDazorBTYbBmVjeIsgizv2jsfuE4Q';

    // 2. إنشاء الاتصال بـ Supabase
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 3. معالجة النموذج عند الضغط على إرسال
    const form = document.getElementById('registrationForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      statusMessage.textContent = 'جاري الحفظ في قاعدة البيانات...';
      statusMessage.style.color = 'black';

      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;

      try {
        // إرسال البيانات إلى جدول registrations مع مراعاة أسماء الأعمدة (full_name و email)
        const { data, error } = await supabaseClient
          .from('registrations')
          .insert([
            { 
              full_name: fullName, 
              email: email 
            }
          ]);

        if (error) throw error;

        statusMessage.textContent = 'تم حفظ البيانات بنجاح في قاعدة البيانات!';
        statusMessage.style.color = 'green';
        form.reset();

      } catch (err) {
        console.error('Database Error:', err);
        statusMessage.textContent = 'حدث خطأ أثناء الحفظ: ' + (err.message || 'يرجى التأكد من إعدادات الصلاحيات');
        statusMessage.style.color = 'red';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
