<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الطلاب</title>
  <!-- مكتبة Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <h2>نموذج التسجيل</h2>
  <form id="registrationForm">
    <label for="name">الاسم كامل:</label><br>
    <input type="text" id="name" required><br><br>

    <label for="email">البريد الإلكتروني:</label><br>
    <input type="email" id="email" required><br><br>

    <label for="phone">رقم الهاتف:</label><br>
    <input type="tel" id="phone" required><br><br>

    <button type="submit">إرسال التسجيل</button>
  </form>

  <p id="statusMessage"></p>

  <script>
    // 1. إعداد قيم الاتصال بـ Supabase الخاصة بمشروعك
    const SUPABASE_URL = 'https://ogesvdbsgptfifllduyv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nZXN2ZGJzZ3B0ZmlmbGxkdXl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDM1MjgsImV4cCI6MjEwMzcxOTUyOH0.iawdyfh61v4mW1ZDazorBTYbBmVjeIsgizv2jsfuE4Q';

    // 2. إنشاء عميل Supabase
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 3. معالجة إرسال النموذج
    const form = document.getElementById('registrationForm');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusMessage.textContent = 'جاري إرسال البيانات...';

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;

      // إرسال البيانات إلى جدول registrations
      const { data, error } = await supabaseClient
        .from('registrations')
        .insert([
          { name: name, email: email, phone: phone }
        ]);

      if (error) {
        console.error('Error inserting data:', error);
        statusMessage.textContent = 'حدث خطأ أثناء التسجيل: ' + error.message;
        statusMessage.style.color = 'red';
      } else {
        statusMessage.textContent = 'تم التسجيل بنجاح!';
        statusMessage.style.color = 'green';
        form.reset();
      }
    });
  </script>

</body>
</html>
